function renderDock(p,full,best){
  const d=game.dice,k=d.filter(Boolean).length,kn=full&&isKniffel(d);
  let hint;
  if(kn){const extra=kbVal()&&p.scores.kn===50;hint=`<b>KNIFFEL!</b> ${extra?`+${kbVal()} extra, Feld wählen`:'Feld wählen'}`}
  else if(full)hint=best?`Meiste: <b>${ALL[best].name}</b>`:'Feld antippen zum Eintragen';
  else if(k)hint=`Noch ${5-k} Würfel eingeben`;
  else hint='Augen antippen oder würfeln';
  const rolledIdx=ui.rolled?[...ui.rolled]:[];
  const slots=d.map((x,i)=>`<button class="slot ${x?'set':''} ${ui.rolled&&ui.rolled.has(i)?'tumble':''}" style="--d:${rolledIdx.indexOf(i)*45}ms" data-act="slot" data-i="${i}" aria-label="${x?`Würfel ${i+1} zeigt ${x}, antippen zum Entfernen`:`Würfel ${i+1} leer`}">${x?die(x):i+1}</button>`).join('');
  const canRoll=!full&&game.rolls<3;
  const firstBtn=game.firstRule?`<button class="firstbtn" data-act="first" aria-pressed="${!!game.first}" aria-label="Wurf stammt aus dem ersten Wurf, plus 5 Punkte">1. Wurf +5</button>`:'';
  return `<div class="dock ${kn?'kniffel':''}" role="region" aria-label="Wurf eingeben"><div class="wrap">
    <div class="dock-hint"><span class="dh">${hint}</span>${firstBtn}<span class="sum">${k?`Σ ${sum(d.filter(Boolean))}`:''}</span></div>
    <div class="slots">${slots}<button class="roll" data-act="roll" ${canRoll?'':'disabled'} aria-label="Leere Plätze würfeln, Wurf ${game.rolls} von 3"><span>${full?'Neu?':'Würfeln'}</span><small>${game.rolls}/3</small></button></div>
    <div class="faces">${[1,2,3,4,5,6].map(f=>`<button class="face" data-act="face" data-v="${f}" ${full?'disabled':''} aria-label="${f} eintragen">${die(f)}</button>`).join('')}<button class="face clr" data-act="clear" ${k?'':'disabled'} aria-label="Alle Würfel entfernen">${ICON.back}</button></div>
  </div></div>`;
}

/* --- kniffel actions --- */
let pendingFlash=null;
function commit(pi,fid,val,fromDice,firstFlag){
  const p=game.players[pi],f=ALL[fid],prev=p.scores[fid],wasEmpty=prev===undefined;
  let extraAdded=false;
  if(fromDice&&kbVal()&&isKniffel(game.dice)&&p.scores.kn===50&&fid!=='kn'){p.extra=(p.extra||0)+1;extraAdded=true}
  let handAdded=false;
  if(firstFlag&&game.firstRule&&wasEmpty&&val>0){p.fh=(p.fh||0)+1;handAdded=true}
  game.undo.push({pi,fid,prev,extraAdded,handAdded,turn:game.turn,view:game.view,dice:game.dice.slice(),rolls:game.rolls});
  if(game.undo.length>60)game.undo.shift();
  if(val===null)delete p.scores[fid];else p.scores[fid]=val;
  if(wasEmpty&&val!==null){game.dice=[0,0,0,0,0];game.rolls=0;game.first=false}
  let msg=val===null?`${f.name} geleert`:val===0?`${f.name} gestrichen`:`${val} bei ${f.name}`;
  if(extraAdded)msg+=` · Extra-Kniffel +${kbVal()}`;
  if(handAdded)msg+=' · +5 erste Hand';
  closeSheet();
  const fin=game.status==='finished';
  if(!fin&&game.players.every(pl=>openFields(pl).length===0)){
    finishGame();render();window.scrollTo(0,0);toast(msg,true);return;
  }
  const advance=wasEmpty&&val!==null&&pi===game.turn&&!fin;
  if(advance){const nt=nextTurn(pi);game.turn=nt;if(nt!==pi)msg+=` · ${game.players[nt].name} ist dran`}
  saveGame();pendingFlash=fid;render();toast(msg,true);
  if(advance&&game.turn!==pi){
    const token=++ui.switchToken,gid=game.id;
    setTimeout(()=>{if(token!==ui.switchToken||!game||game.id!==gid||game.status==='finished'||game.view!==pi||(game.tbl&&game.tblSeat!=null)||$('#layer .sheet'))return;game.view=game.turn;saveGame();render();window.scrollTo({top:0,behavior:reduceMotion?'auto':'smooth'})},1100);
  }
}
function nextTurn(from){const n=game.players.length;for(let k=1;k<=n;k++){const j=(from+k)%n;if(openFields(game.players[j]).length)return j}return from}
function kUndo(){
  const u=game.undo.pop();
  if(!u){toast('Nichts zum Rückgängigmachen');return}
  const p=game.players[u.pi];
  if(u.kind==='xk'){p.extra=u.prevExtra}
  else if(u.kind==='fh'){p.fh=u.prevFh}
  else{if(u.prev===undefined)delete p.scores[u.fid];else p.scores[u.fid]=u.prev;if(u.extraAdded)p.extra--;if(u.handAdded)p.fh=Math.max(0,(p.fh||0)-1);game.dice=u.dice;game.rolls=u.rolls}
  game.first=false;
  game.turn=u.turn;game.view=u.pi;
  if(game.status==='finished'){game.status='active';delete game.finishedAt;game.record=null;ui.review=false}
  ui.switchToken++;saveGame();closeSheet();pendingFlash=u.fid||null;render();toast('Rückgängig gemacht');
  if(u.fid){const el=$(`.row[data-f="${u.fid}"]`);if(el)el.scrollIntoView({block:'center',behavior:reduceMotion?'auto':'smooth'})}
}
function onField(fid){
  const p=game.players[game.view],filled=p.scores[fid]!==undefined;
  if(game.input==='dice'&&game.status!=='finished'&&!filled&&game.dice.every(Boolean)){commit(game.view,fid,ALL[fid].calc(game.dice),true,game.first);return}
  openFieldSheet(fid);
}
function roll(){
  if(game.rolls>=3)return;
  const idx=[],fresh=game.rolls===0&&game.dice.every(x=>!x);
  game.dice=game.dice.map((x,i)=>{if(x)return x;idx.push(i);return rnd6()});
  if(!idx.length)return;
  game.rolls++;
  if(game.rolls>1)game.first=false;else if(fresh)game.first=true;
  ui.rolled=new Set(idx);saveGame();render();
}

      game.undo.push({kind:'fh',pi:game.view,prevFh:p.fh||0,turn:game.turn,view:game.view});p.fh=nv;saveGame();render();

    case 'xk':{const p=game.players[game.view],d=+b.dataset.d;const nv=Math.max(0,(p.extra||0)+d);if(nv===p.extra)return true;

const LC={};
const MARKS=[['c'],['p',4,45,1.38],['p',3,-90,1.4],['p',4,0,1.5],['p',3,90,1.4],['p',5,-90,1.22],['p',6,0,1.2],['x']];
const fmtN=v=>v<0?'−'+Math.abs(v):String(v);
function markSVG(k,cx,cy,r,attrs=''){
  cx=+cx;cy=+cy;
  const s=MARKS[((k%8)+8)%8];
  if(s[0]==='c')return `<circle cx="${cx}" cy="${cy}" r="${r}" ${attrs}/>`;
  if(s[0]==='x'){
    const a=r*.45,b=r*1.2,pts=[[-a,-b],[a,-b],[a,-a],[b,-a],[b,a],[a,a],[a,b],[-a,b],[-a,a],[-b,a],[-b,-a],[-a,-a]];
    return `<polygon points="${pts.map(([x,y])=>(cx+x).toFixed(1)+','+(cy+y).toFixed(1)).join(' ')}" ${attrs}/>`;
  }
  const [,n,rot,sc]=s,rr=r*sc,pts=[];
  for(let i=0;i<n;i++){const a=(rot+i*360/n)*Math.PI/180;pts.push((cx+rr*Math.cos(a)).toFixed(1)+','+(cy+rr*Math.sin(a)).toFixed(1))}
  return `<polygon points="${pts.join(' ')}" ${attrs}/>`;
}
function niceTicks(lo,hi,want=4){
  if(!(hi>lo))hi=lo+1;
  const raw=(hi-lo)/want,mag=Math.pow(10,Math.floor(Math.log10(raw))),m=raw/mag;
  const step=(m<=1?1:m<=2?2:m<=5?5:10)*mag;
  const a=Math.floor(lo/step+1e-9)*step,b=Math.ceil(hi/step-1e-9)*step,t=[];
  for(let v=a;v<=b+step/2;v+=step)t.push(Math.round(v*1e6)/1e6);
  return t;
}
const shortName=s=>s.length>8?s.slice(0,7)+'…':s;
/* c: {id,title,series:[{name,color,mk,pts:[[x,y]]}],zero,direct,xTitle,head(x),xlab(x),table:{head,rows},aria} */

  const all=c.series.flatMap(s=>s.pts);
  if(!all.length)return '';
  const W=340,H=c.h||236,direct=!!c.direct&&c.series.length>1&&c.series.length<=4;
  const ml=38,mt=14,mb=c.xTitle?40:28,mr=direct?60:16,pw=W-ml-mr,ph=H-mt-mb;
  const xs=[...new Set(all.map(p=>p[0]))].sort((a,b)=>a-b);
  const xmin=c.xmin!==undefined?c.xmin:xs[0];
  const xmax=Math.max(c.xmax!==undefined?c.xmax:xs[xs.length-1],xmin+1);
  let lo=Math.min(...all.map(p=>p[1])),hi=Math.max(...all.map(p=>p[1]));
  if(c.zero){lo=Math.min(lo,0);hi=Math.max(hi,0)}
  if(lo===hi){lo-=1;hi+=1}
  const tk=niceTicks(lo,hi,4),ymin=tk[0],ymax=tk[tk.length-1];
  const X=v=>ml+(v-xmin)/(xmax-xmin)*pw,Y=v=>mt+(1-(v-ymin)/(ymax-ymin))*ph;
  const f1=v=>(Math.round(v*10)/10).toString();
  let grid='',lines='',marks='',labs='';
  tk.forEach(v=>{
    const y=f1(Y(v)),z=c.zero&&v===0;
    grid+=`<line class="lc-grid${z?' z':''}" x1="${ml}" x2="${W-mr}" y1="${y}" y2="${y}"/><text class="lc-t" x="${ml-7}" y="${f1(+y+4.2)}" text-anchor="end">${fmtN(v)}</text>`;
  });
  const span=xmax-xmin,stp=Math.max(1,Math.ceil(span/7));
  for(let v=Math.ceil(xmin);v<=xmax+1e-9;v+=stp){
    grid+=`<line class="lc-tick" x1="${f1(X(v))}" x2="${f1(X(v))}" y1="${f1(mt+ph)}" y2="${f1(mt+ph+5)}"/><text class="lc-t" x="${f1(X(v))}" y="${f1(mt+ph+19)}" text-anchor="middle">${esc(c.xlab?c.xlab(v):String(v))}</text>`;
  }
  grid+=`<line class="lc-axis" x1="${ml}" x2="${W-mr}" y1="${f1(mt+ph)}" y2="${f1(mt+ph)}"/>`;
  if(c.xTitle)grid+=`<text class="lc-t" x="${W-mr}" y="${H-5}" text-anchor="end">${esc(c.xTitle)}</text>`;
  c.series.forEach(s=>{
    if(!s.pts.length)return;
    lines+=`<path class="lc-line" style="stroke:${s.color}" d="${s.pts.map((p,i)=>(i?'L':'M')+f1(X(p[0]))+' '+f1(Y(p[1]))).join('')}"/>`;
    const list=s.pts.length<=14?s.pts:[s.pts[s.pts.length-1]];
    list.forEach(p=>{marks+=markSVG(s.mk,f1(X(p[0])),f1(Y(p[1])),4.5,`class="lc-mk" style="fill:${s.color}"`)});
  });
  if(direct){
    const rows=c.series.filter(s=>s.pts.length).map(s=>{const p=s.pts[s.pts.length-1];return {s,x:X(p[0]),y:Y(p[1])}}).sort((a,b)=>a.y-b.y);
    rows.forEach((r,i)=>{r.ly=i?Math.max(r.y,rows[i-1].ly+15):r.y});
    const maxY=mt+ph;if(rows.length&&rows[rows.length-1].ly>maxY){rows[rows.length-1].ly=maxY;for(let i=rows.length-2;i>=0;i--)rows[i].ly=Math.min(rows[i].ly,rows[i+1].ly-15)}
    rows.forEach(r=>{labs+=`<text class="lc-lab" x="${f1(r.x+10)}" y="${f1(r.ly+4.5)}">${esc(shortName(r.s.name))}</text>`});
  }
  LC[c.id]={W,H,X,Y,xs,series:c.series,head:c.head||(x=>String(x)),fmt:c.fmt||fmtN};
  const tableOn=!!(ui.ct&&ui.ct[c.id]&&c.table);
  const tbl=c.table?`<div class="tbl-wrap lc-tbl"><table class="tbl"><thead><tr>${c.table.head.map((h,i)=>`<th scope="col">${esc(h)}</th>`).join('')}</tr></thead><tbody>${c.table.rows.map(r=>`<tr>${r.map((v,i)=>i?`<td>${esc(v)}</td>`:`<th scope="row">${esc(v)}</th>`).join('')}</tr>`).join('')}</tbody></table></div>`:'';
  const leg=c.series.length>1||c.legend?`<ul class="lc-leg" aria-label="Legende">${c.series.map(s=>`<li><svg width="16" height="16" viewBox="-8 -8 16 16" aria-hidden="true">${markSVG(s.mk,0,0,4.5,`style="fill:${s.color}"`)}</svg><span>${esc(s.name)}</span></li>`).join('')}</ul>`:'';
  return `<figure class="lc" data-chart="${c.id}">
    <div class="lc-h"><h3>${esc(c.title||'')}</h3>${c.table?`<button class="link" data-act="ctable" data-id="${c.id}" aria-pressed="${tableOn}">${tableOn?'Diagramm':'Tabelle'}</button>`:''}</div>
    ${tableOn?tbl:`<div class="lc-plot"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(c.aria||c.title||'Liniendiagramm')}">${grid}<line class="lc-cross" y1="${mt}" y2="${mt+ph}" x1="0" x2="0"/>${lines}${marks}${labs}<g class="lc-hov"></g><rect class="lc-hit" x="0" y="0" width="${W}" height="${H}"/></svg><div class="lc-tip" role="status"></div></div>${leg}`}
    ${c.note?`<p class="note" style="margin:0">${esc(c.note)}</p>`:''}
  </figure>`;
}
function lcHide(){
  document.querySelectorAll('.lc-cross.on').forEach(e=>e.classList.remove('on'));
  document.querySelectorAll('.lc-tip.on').forEach(e=>e.classList.remove('on'));
  document.querySelectorAll('.lc-hov').forEach(e=>{e.innerHTML=''});
}
function lcShow(fig,cd,x){
  const svg=fig.querySelector('svg'),plot=fig.querySelector('.lc-plot'),tip=fig.querySelector('.lc-tip');
  if(!svg||!tip)return;
  const cx=cd.X(x),cr=svg.querySelector('.lc-cross');
  cr.setAttribute('x1',cx);cr.setAttribute('x2',cx);cr.classList.add('on');
  const rows=cd.series.map(s=>({s,p:s.pts.find(p=>p[0]===x)})).filter(r=>r.p);
  svg.querySelector('.lc-hov').innerHTML=rows.map(r=>markSVG(r.s.mk,cx.toFixed(1),cd.Y(r.p[1]).toFixed(1),6,`class="lc-mk" style="fill:${r.s.color}"`)).join('');
  rows.sort((a,b)=>b.p[1]-a.p[1]);
  tip.innerHTML=`<b class="h">${esc(cd.head(x))}</b>`+rows.map(r=>`<div class="r"><i style="background:${r.s.color}"></i><span>${esc(r.s.name)}</span><b>${esc(cd.fmt(r.p[1],r.p))}</b></div>`).join('');
  tip.classList.add('on');
  const pwid=plot.clientWidth,px=cx/cd.W*pwid,tw=tip.offsetWidth;
  let left=px+14;if(left+tw>pwid)left=px-14-tw;
  tip.style.left=Math.max(0,left)+'px';
}
function lcPointer(e){
  const hit=e.target&&e.target.closest?e.target.closest('.lc-hit'):null;
  if(!hit){if(e.type==='pointermove'&&e.pointerType==='mouse')lcHide();else if(e.type==='pointerdown')lcHide();return}
  const fig=hit.closest('.lc'),cd=fig&&LC[fig.dataset.chart];if(!cd)return;
  const r=hit.ownerSVGElement.getBoundingClientRect(),vx=(e.clientX-r.left)/r.width*cd.W;
  let best=cd.xs[0],bd=1e9;cd.xs.forEach(x=>{const d=Math.abs(cd.X(x)-vx);if(d<bd){bd=d;best=x}});
  lcShow(fig,cd,best);
}
document.addEventListener('pointermove',lcPointer);
document.addEventListener('pointerdown',lcPointer);
document.addEventListener('keydown',e=>{if(e.key==='Escape')lcHide()});

/* cumulative chart for round based games: cum[i]=[0,..] */
function roundsChart(id,g,cum,title){
  const n=cum[0].length-1;
  if(n<1)return '';
  const series=g.players.map((p,i)=>({name:p.name,color:`var(--c${p.color})`,mk:p.color,pts:cum[i].map((v,k)=>[k,v])}));
  const best=Math.max(...cum.map(c=>c[n])),lead=g.players.filter((_,i)=>cum[i][n]===best).map(p=>p.name).join(' und ');
  return lineChart({id,title,series,zero:true,direct:true,xTitle:'Runde',h:236,
    head:x=>x?`Nach Runde ${x}`:'Start',xlab:v=>String(v),
    table:{head:['Runde',...g.players.map(p=>p.name)],rows:cum[0].map((_,k)=>[k?String(k):'Start',...cum.map(c=>fmtN(c[k]))])},
    aria:`Liniendiagramm: Punktestand nach jeder der ${n} Runden. Vorne liegt ${lead} mit ${fmtN(best)} Punkten.`});
}
function chartSection(html,empty){
  return html?`<section class="card lcard">${html}</section>`:`<div class="blank"><b>Noch kein Verlauf</b>${empty}</div>`;
}

/* =====================================================
   GAME: WIZARD
   ===================================================== */
const wset=()=>S.meta.settings.wizard;
const wTotal=g=>{const f=Math.max(1,Math.floor(60/Math.max(1,g.players.length)));return g.len==='short'?Math.ceil(f/2):f};
const wScore=(b,t)=>b===t?20+10*t:-10*Math.abs(b-t);
const wDone=g=>g.rounds.filter(r=>r.t).length;
function wState(g){
  const tot=wTotal(g),n=g.rounds.length,last=g.rounds[n-1];
  if(last&&!last.t)return {k:n,phase:'trick'};
  if(n>=tot)return {k:tot,phase:'done'};
  return {k:n+1,phase:'bid'};
}
function wCum(g){
  return g.players.map((_,i)=>{let s=0;const a=[0];g.rounds.forEach(r=>{if(r.t){s+=wScore(r.b[i],r.t[i]);a.push(s)}});return a});
}
function wCreate(ps,o){
  return {id:'g'+rid(),type:'wizard',len:o.len==='short'?'short':'full',
    players:ps.map(p=>({pid:p.pid,name:p.name,color:p.color})),rounds:[],undo:[],view:0,turn:0,
    status:'active',created:Date.now(),u:Date.now()};
}
function wResult(g){
  const cum=wCum(g),done=cum[0].length-1;
  return rank(g.players.map((p,i)=>{
    const hits=g.rounds.filter(r=>r.t&&r.b[i]===r.t[i]).length;
    return {i,pid:p.pid,name:p.name,color:p.color,total:cum[i][done],sub:done?`${hits} von ${done} Ansagen richtig`:'Noch keine Runde'};
  }),true);
}
function wSetupHTML(){
  const s=wset(),n=ui.setup?ui.setup.sel.length:0,full=n>=3&&n<=6?Math.floor(60/n):0;
  const txt=len=>full?`${len==='full'?full:Math.ceil(full/2)} Runden bei ${n} Spielern`:(len==='full'?'60 geteilt durch die Spielerzahl, also 10 bis 20 Runden':'Halb so viele Runden, ein kürzerer Abend');
  return `<section class="card" aria-labelledby="hL">
    <h2 class="lbl" id="hL">Spiellänge</h2>
    <div class="variants">
      <button class="vopt" data-act="wlen" data-v="full" aria-pressed="${s.len!=='short'}"><span class="vname">Komplett</span><span class="vdesc">${txt('full')}</span></button>
      <button class="vopt" data-act="wlen" data-v="short" aria-pressed="${s.len==='short'}"><span class="vname">Kurz</span><span class="vdesc">${txt('short')}</span></button>
    </div>
    <p class="note" style="margin:0">Der erste Spieler gibt in Runde 1, danach wechselt der Geber reihum. Wizard geht mit 3 bis 6 Spielern. <button class="link" data-act="wrules" style="display:inline;padding:0;font-size:inherit">So wird gezählt</button></p>
  </section>`;
}
const wSign=v=>v>0?'+'+v:v<0?'−'+Math.abs(v):'0';
function renderWizard(){
  if(game.status==='finished'&&!ui.review)return renderEnd();
  const g=game,fin=g.status==='finished',tot=wTotal(g),st=wState(g),res=wResult(g),done=wDone(g),N=g.players.length;
  const dealer=g.players[(st.k-1)%N],starter=g.players[st.k%N],cur=g.rounds[st.k-1];
  const cum=wCum(g);
  const stands=res.map(r=>{
    const d=done?cum[r.i][done]-cum[r.i][done-1]:null;
    return `<li class="stand ${r.place===1&&done&&N>1?'lead':''}" style="--pc:var(--p${r.color})">
      <span class="rk">${r.place}</span>${av(r)}
      <span class="stand-n"><b>${esc(r.name)}</b><small>${d===null?'Noch keine Runde':`Letzte Runde ${wSign(d)}`}</small></span>
      <span class="stand-t mono">${fmtN(r.total)}</span></li>`;
  }).join('');
  let now='';
  if(!fin){
    if(st.phase==='done')now=`<div class="notice"><span>Alle ${tot} Runden gespielt.</span><button class="btn sm" data-act="finish">Auswerten</button></div>`;
    else now=`<section class="wz-now" aria-live="polite">
      <div class="wz-k"><b>Runde ${st.k}</b><span>von ${tot} · ${st.k} ${st.k===1?'Karte':'Karten'} pro Spieler</span></div>
      <p class="wz-deal">Geber <b>${esc(dealer.name)}</b> · Ansage beginnt bei <b>${esc(starter.name)}</b></p>
      ${st.phase==='trick'?`<div class="wz-bids" aria-label="Ansagen">${g.players.map((p,i)=>`<span class="wz-bid" style="--pc:var(--p${p.color})"><span class="dot"></span>${esc(shortName(p.name))} <b>${cur.b[i]}</b></span>`).join('')}</div>
        <p class="wz-deal">Ansagen zusammen: <b>${cur.b.reduce((a,b)=>a+b,0)}</b> bei ${st.k} ${st.k===1?'Stich':'Stichen'}</p>`:''}
      <span class="bar"><i style="width:${Math.round(done/tot*100)}%"></i></span>
    </section>`;
  }else now=`<div class="notice"><span>Spiel beendet.</span><button class="btn sm" data-act="showresult">Ergebnis</button></div>`;
  const th=g.players.map(p=>`<th scope="col" aria-label="${esc(p.name)}">${av(p,'sm')}</th>`).join('');
  const rows=g.rounds.map((r,k)=>`<tr><th scope="row">${k+1}</th>${g.players.map((p,i)=>{
    if(!r.t)return `<td><button class="wc open" data-act="wround" data-i="${k}" aria-label="Runde ${k+1}, ${esc(p.name)}: Ansage ${r.b[i]}, Stiche offen"><b>…</b><small>sagt ${r.b[i]}</small></button></td>`;
    const sc=wScore(r.b[i],r.t[i]),ok=r.b[i]===r.t[i];
    return `<td><button class="wc ${ok?'ok':'no'}" data-act="wround" data-i="${k}" aria-label="Runde ${k+1}, ${esc(p.name)}: Ansage ${r.b[i]}, Stiche ${r.t[i]}, ${sc} Punkte"><b>${sc>0?'+':''}${fmtN(sc)}</b><small>${r.b[i]}/${r.t[i]}</small></button></td>`}).join('')}</tr>`).join('');
  const chart=roundsChart('r-'+g.id,g,cum,'Punkteverlauf');
  return `<header class="top"><div class="wrap topbar">
    <button class="iconbtn" data-act="home" aria-label="Zum Hauptmenü">${ICON.chevL}</button>
    <div class="brand"><div class="t">Wizard</div><div class="sub">${done} von ${tot} Runden · ${N} Spieler</div></div>
    <button class="iconbtn" data-act="menu" aria-label="Menü">${ICON.dots}</button>
  </div></header>
  <main class="wrap main ${fin?'':'has-dock2'}">
    ${now}
    <ol class="stands" aria-label="Zwischenstand">${stands}</ol>
    ${chartSection(chart,'Nach der ersten abgeschlossenen Runde zeichnet der Block hier den Punkteverlauf aller Spieler.')}
    ${g.rounds.length?`<div class="tbl-wrap"><table class="tbl wt"><thead><tr><th scope="col">Rd.</th>${th}</tr></thead><tbody>${rows}</tbody><tfoot><tr class="sum tot"><th scope="row">Σ</th>${g.players.map((_,i)=>`<td>${fmtN(cum[i][done])}</td>`).join('')}</tr></tfoot></table></div><p class="note" style="margin:0">Unter den Punkten steht Ansage/Stiche. Runde antippen, um sie zu ändern.</p>`
      :`<div class="blank"><b>Noch keine Runde</b>Erst sagt jeder seine Stiche an, nach der Runde trägst du ein, wie viele es wirklich waren.</div>`}
  </main>
  ${fin?'':`<div class="dock" role="region" aria-label="Runde eintragen"><div class="wrap">${st.phase==='done'?'<button class="btn primary big" data-act="finish">Spiel auswerten</button>':`<button class="btn primary big" data-act="wopen">${st.phase==='bid'?`Ansagen für Runde ${st.k}`:`Stiche für Runde ${st.k}`}</button>`}</div></div>`}`;
}

/* ---- round sheet: bids / tricks ---- */
function wizSheetInner(){
  const w=ui.wz,g=game,k=w.k,sum=a=>a.reduce((x,y)=>x+y,0);
  const stp=(i,f,val,label)=>`<div class="wz-st"><span class="wz-l">${label}</span>
    <button type="button" class="wz-b" data-act="wstep" data-i="${i}" data-f="${f}" data-d="-1" aria-label="${label} verringern" ${val<=0?'disabled':''}>−</button>
    <output class="wz-n" aria-label="${label}">${val}</output>
    <button type="button" class="wz-b" data-act="wstep" data-i="${i}" data-f="${f}" data-d="1" aria-label="${label} erhöhen" ${val>=k?'disabled':''}>+</button></div>`;
  const rows=g.players.map((p,i)=>{
    const pts=w.showT?wScore(w.b[i],w.t[i]):null;
    return `<div class="wz-row" style="--pc:var(--p${p.color})">
      <div class="wz-name"><span class="dot"></span><span>${esc(p.name)}${g.tbl&&g.tblSeat===p.color?' <em class="me">du</em>':''}</span>${pts!==null?`<span class="wz-pts ${pts<0?'neg':''}">${wSign(pts)}</span>`:''}</div>
      <div class="wz-ctrls">${w.showB?stp(i,'b',w.b[i],'Ansage'):`<div class="wz-st fix"><span class="wz-l">Ansage</span><span class="wz-n">${w.b[i]}</span></div>`}${w.showT?stp(i,'t',w.t[i],'Stiche'):''}</div></div>`;
  }).join('');
  let info='',ok=true;
  if(w.showB){
    const sb=sum(w.b),d=sb-k;
    if(sb===k){ok=false;info+=`<p class="wz-sum bad">Die Ansagen dürfen nicht aufgehen: zusammen ${sb} bei ${k} ${k===1?'Stich':'Stichen'}. Einer muss höher oder niedriger ansagen, meistens der Geber.</p>`}
    else info+=`<p class="wz-sum">Ansagen zusammen: <b>${sb}</b> bei ${k} ${k===1?'Stich':'Stichen'} (${d>0?`${d} zu viel`:`${-d} zu wenig`}) \u2713</p>`;
  }
  if(w.showT){
    const s=sum(w.t);
    if(s!==k)ok=false;
    info+=s===k?`<p class="wz-sum">Stiche zusammen: <b>${s}</b> von ${k} \u2713</p>`:`<p class="wz-sum bad">Es müssen genau ${k} ${k===1?'Stich':'Stiche'} sein, gerade sind es ${s}.</p>`;
  }
  const label=w.isNew?'Ansagen speichern':w.showT&&!w.showB?'Runde abschließen':'Änderung speichern';
  const canDel=!w.isNew&&w.idx===g.rounds.length-1;
  return `<div class="sh-head"><div><div class="eyebrow">${w.isNew?'Neue Runde':w.showB&&w.showT?'Runde bearbeiten':w.showT?'Nach dem Spielen':'Ansagen ändern'} · ${k} ${k===1?'Karte':'Karten'}</div><h2>${w.showB&&w.showT?'Runde '+k:(w.showT?'Stiche':'Ansagen')+' · Runde '+k}</h2></div>${closeBtn}</div>
  <div class="wz-rows">${rows}</div>${info}
  <button class="btn primary big" type="button" data-act="wsave" ${ok?'':'disabled'}>${label}</button>
  ${canDel?'<button type="button" class="link" data-act="wdel" style="margin-top:8px">Runde zurücksetzen</button>':''}`;
}
function openWizSheet(mode,idx){
  const g=game,N=g.players.length;let w;
  if(mode==='bid')w={isNew:true,idx:g.rounds.length,k:g.rounds.length+1,b:Array(N).fill(0),t:null,showB:true,showT:false};
  else{
    const r=g.rounds[idx];if(!r)return;
    if(mode==='trick')w={isNew:false,idx,k:idx+1,b:r.b.slice(),t:r.b.slice(),showB:false,showT:true};
    else if(r.t)w={isNew:false,idx,k:idx+1,b:r.b.slice(),t:r.t.slice(),showB:true,showT:true};
    else w={isNew:false,idx,k:idx+1,b:r.b.slice(),t:null,showB:true,showT:false};
  }
  ui.wz=w;
  openSheet(`<div id="wzBody">${wizSheetInner()}</div>`);
}
function refreshWizSheet(focusSel){
  const el=$('#wzBody');if(!el||!ui.wz)return;
  el.innerHTML=wizSheetInner();
  if(focusSel){const f=el.querySelector(focusSel);if(f&&!f.disabled)try{f.focus({preventScroll:true})}catch(e){}}
}
function wizSave(){
  const w=ui.wz,g=game;if(!w)return;
  if(w.showB&&w.b.reduce((a,b)=>a+b,0)===w.k){toast('Die Ansagen dürfen nicht aufgehen');return}
  if(w.showT&&w.t.reduce((a,b)=>a+b,0)!==w.k){toast(`Es müssen genau ${w.k} Stiche sein`);return}
  let msg;
  if(w.isNew){g.rounds.push({b:w.b.slice(),t:null});g.undo.push({k:'add'});msg=`Ansagen für Runde ${w.k} gespeichert`}
  else{
    const r=g.rounds[w.idx];if(!r)return;
    g.undo.push({k:'edit',idx:w.idx,prev:{b:r.b.slice(),t:r.t?r.t.slice():null}});
    const had=!!r.t;
    if(w.showB)r.b=w.b.slice();
    if(w.showT)r.t=w.t.slice();
    msg=w.showT&&!had?`Runde ${w.k} abgeschlossen`:`Runde ${w.k} geändert`;
  }
  if(g.undo.length>60)g.undo.shift();
  const st=wState(g);
  saveGame();closeSheet();render();toast(msg,true);
  if(st.phase==='done'&&!w.isNew)setTimeout(()=>toast('Alle Runden gespielt. Zeit zum Auswerten!'),600);
}
function wUndo(){
  const g=game,u=g.undo.pop();
  if(!u){toast('Nichts zum Rückgängigmachen');return}
  if(u.k==='add')g.rounds.pop();
  else if(u.k==='edit')g.rounds[u.idx]=u.prev;
  else if(u.k==='del')g.rounds.splice(u.idx,0,u.prev);
  if(g.status==='finished'){g.status='active';delete g.finishedAt;g.record=null;ui.review=false}
  saveGame();closeSheet();render();toast('Rückgängig gemacht');
}
function wMenu(){
  const g=game,fin=g.status==='finished',last=g.undo[g.undo.length-1];

function openWizRules(){
  openSheet(`<div class="sh-head"><div><div class="eyebrow">Wizard</div><h2>So wird gezählt</h2></div>${closeBtn}</div>
  <div class="rules">
    <section><h3>Ablauf</h3>
      <p>In Runde 1 bekommt jeder 1 Karte, in Runde 2 zwei Karten und so weiter. Gespielt werden 60 geteilt durch die Spielerzahl Runden, also 20 bei 3, 15 bei 4, 12 bei 5 und 10 bei 6 Spielern.</p>
      <p>Nach dem Geben sagt jeder an, wie viele Stiche er gewinnen will. Es beginnt der Spieler links vom Geber. Die Ansagen dürfen zusammen nicht genau der Kartenzahl entsprechen, es wird also immer zu viel oder zu wenig angesagt. Das ist die Aufgabe des Gebers, der als Letzter ansagt. Danach wird gespielt und gezählt. Der Geber wechselt jede Runde reihum.</p>
    </section>
    <section><h3>Punkte</h3>
      <div class="ritem"><div class="ritem-h"><b>Ansage getroffen</b><span>20 + 10 je Stich</span></div><p>Wer genau so viele Stiche macht wie angesagt, bekommt 20 Punkte plus 10 für jeden Stich. Angesagt und geholt 2: 40 Punkte. Angesagt 0 und leer ausgegangen: 20 Punkte.</p></div>
      <div class="ritem"><div class="ritem-h"><b>Ansage verfehlt</b><span>−10 je Stich Abweichung</span></div><p>Wer danebenliegt, verliert 10 Punkte für jeden Stich Unterschied, egal ob zu viele oder zu wenige. Angesagt 3 und 1 geholt: −20 Punkte.</p></div>
    </section>
    <section><h3>So nutzt du den Block</h3><ul>
      <li>Vor dem Spielen trägst du die Ansagen ein. Danach spielt ihr die Runde.</li>
      <li>Danach trägst du die echten Stiche ein. Sie sind schon mit den Ansagen vorbelegt, du änderst nur die Abweichungen. Die Stiche müssen zusammen der Kartenzahl entsprechen.</li>
      <li>Das Diagramm zeigt, wie sich die Punktestände Runde für Runde entwickeln. Tippe oder fahre mit dem Finger darüber, um die Werte zu sehen.</li>
    </ul></section>
  </div>`);
}
function wAct(a,b){
  const v=b.dataset.v;
  if(a==='wlen'){wset().len=v==='short'?'short':'full';touchMeta();render();return true}
  if(a==='wrules'){openWizRules();return true}
  if(!game||game.type!=='wizard')return false;
  switch(a){
    case 'wopen':{const st=wState(game);if(st.phase==='bid')openWizSheet('bid');else if(st.phase==='trick')openWizSheet('trick',st.k-1);return true}
    case 'wround':openWizSheet('edit',+b.dataset.i);return true;
    case 'wstep':{
      const w=ui.wz;if(!w)return true;
      const arr=b.dataset.f==='b'?w.b:w.t,i=+b.dataset.i;
      arr[i]=Math.max(0,Math.min(w.k,arr[i]+(+b.dataset.d)));
      refreshWizSheet(`[data-act="wstep"][data-i="${i}"][data-f="${b.dataset.f}"][data-d="${b.dataset.d}"]`);return true}
    case 'wsave':wizSave();return true;
    case 'wdel':{
      const w=ui.wz;if(!w||w.isNew)return true;
      if(!confirmed('wdel',null,''))return (b.textContent='Nochmal tippen zum Zurücksetzen',true);
      const idx=w.idx,r=game.rounds[idx];if(!r)return true;
      game.undo.push({k:'del',idx,prev:{b:r.b.slice(),t:r.t?r.t.slice():null}});game.rounds.splice(idx,1);
      saveGame();closeSheet();render();toast(`Runde ${idx+1} zurückgesetzt`,true);return true}
  }
  return false;
}

/* =====================================================
   GAME: PUNKTETAFEL (universal score pad)
   ===================================================== */
const tTotals=g=>g.players.map((_,i)=>g.rounds.reduce((a,r)=>a+(+r[i]||0),0));
const tCum=g=>g.players.map((_,i)=>{let s=0;return [0,...g.rounds.map(r=>(s+=(+r[i]||0)))]});
function tCreate(ps,o){
  return {id:'g'+rid(),type:'tafel',mode:o.mode==='low'?'low':'high',target:Math.max(0,num(o.target)|0),
    players:ps.map(p=>({pid:p.pid,name:p.name,color:p.color})),rounds:[],undo:[],view:0,turn:0,
    status:'active',created:Date.now(),u:Date.now()};
}
function tResult(g){
  const t=tTotals(g),last=g.rounds[g.rounds.length-1];
  const n=g.rounds.length;
  return rank(g.players.map((p,i)=>({i,pid:p.pid,name:p.name,color:p.color,total:t[i],last:last?(+last[i]||0):null,sub:`${n} ${n===1?'Runde':'Runden'}`})),g.mode!=='low');
}
function tReached(g){
  if(!g.target||!g.rounds.length)return null;
  const t=tTotals(g),names=g.players.filter((_,i)=>t[i]>=g.target).map(p=>p.name);
  return names.length?names:null;
}
function tSetupHTML(){
  const s=tset(),hi=s.mode!=='low';
  return `<section class="card" aria-labelledby="hW">
    <h2 class="lbl" id="hW">Wertung</h2>
    <div class="variants">
      <button class="vopt" data-act="tmode" data-v="high" aria-pressed="${hi}"><span class="vname">Höchste</span><span class="vdesc">Wer am meisten Punkte hat, gewinnt</span></button>
      <button class="vopt" data-act="tmode" data-v="low" aria-pressed="${!hi}"><span class="vname">Niedrigste</span><span class="vdesc">Wer am wenigsten hat, gewinnt</span></button>
    </div>
  </section>
  <section class="card" aria-labelledby="hZ">
    <h2 class="lbl" id="hZ">Zielpunktzahl <span style="text-transform:none;letter-spacing:0;font-weight:500">(optional)</span></h2>
    <div class="chips" style="margin-top:0">${[0,50,100,250,500,1000].map(v=>`<button type="button" class="chip ${v?'':'txt'}" data-act="ttarget" data-v="${v}" aria-pressed="${s.target===v}">${v?v:'Kein Ziel'}</button>`).join('')}</div>
    <input id="tgt" class="pin" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="5" placeholder="Eigene Zahl" value="${s.target&&![50,100,250,500,1000].includes(s.target)?s.target:''}" aria-label="Eigene Zielpunktzahl">
    <p class="note" style="margin:0">Sobald jemand das Ziel erreicht, schlägt der Block die Auswertung vor. Du kannst trotzdem weiterspielen.</p>

function renderTafel(){
  if(game.status==='finished'&&!ui.review)return renderEnd();
  const g=game,fin=g.status==='finished',res=tResult(g),n=g.rounds.length,hi=g.mode!=='low';
  const hit=!fin?tReached(g):null;
  const stands=res.map(r=>{
    const pct=g.target?Math.max(0,Math.min(100,r.total/g.target*100)):0;
    const d=r.last;
    return `<li class="stand ${r.place===1&&n&&g.players.length>1?'lead':''}" style="--pc:var(--p${r.color})">
      <span class="rk">${r.place}</span>${av(r)}
      <span class="stand-n"><b>${esc(r.name)}</b><small>${d===null?'Noch keine Runde':`Letzte Runde ${d>0?'+':d<0?'−':'±'}${Math.abs(d)}`}</small>${g.target?`<span class="bar"><i style="width:${pct}%"></i></span>`:''}</span>
      <span class="stand-t mono">${r.total}</span></li>`;
  }).join('');
  const th=g.players.map(p=>`<th scope="col" style="--pc:var(--p${p.color})"><span class="dot"></span>${esc(p.name)}</th>`).join('');
  const rows=g.rounds.map((r,k)=>`<tr><th scope="row">${k+1}</th>${g.players.map((_,i)=>{const v=+r[i]||0;return `<td><button class="tc ${v===0?'o':''}" data-act="tround" data-i="${k}" aria-label="Runde ${k+1}, ${esc(g.players[i].name)}: ${v}">${v}</button></td>`}).join('')}</tr>`).join('');
  const tot=tTotals(g);
  return `<header class="top"><div class="wrap topbar">
    <button class="iconbtn" data-act="home" aria-label="Zum Hauptmenü">${ICON.chevL}</button>
    <div class="brand"><div class="t">Punktetafel</div><div class="sub">${n} ${n===1?'Runde':'Runden'} · ${hi?'Höchste gewinnt':'Niedrigste gewinnt'}${g.target?` · Ziel ${g.target}`:''}</div></div>
    <button class="iconbtn" data-act="menu" aria-label="Menü">${ICON.dots}</button>
  </div></header>
  <main class="wrap main ${fin?'':'has-dock2'}">
    ${fin?`<div class="notice"><span>Spiel beendet.</span><button class="btn sm" data-act="showresult">Ergebnis</button></div>`:''}
    ${hit?`<div class="notice"><span>Ziel ${g.target} erreicht: <b>${esc(hit.join(', '))}</b></span><button class="btn sm" data-act="finish">Auswerten</button></div>`:''}
    <ol class="stands" aria-label="Zwischenstand">${stands}</ol>
    ${n>1?chartSection(roundsChart('r-'+g.id,g,tCum(g),'Punkteverlauf'),''):''}
    ${n?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th scope="col">Runde</th>${th}</tr></thead><tbody>${rows}</tbody><tfoot><tr class="sum tot"><th scope="row">Summe</th>${tot.map(v=>`<td>${v}</td>`).join('')}</tr></tfoot></table></div><p class="note" style="margin:0">Wert antippen, um die Runde zu ändern.</p>`
      :`<div class="blank"><b>Noch keine Runde</b>Tippe unten auf „Runde eintragen“ und gib für jeden Spieler die Punkte ein.</div>`}
  </main>
  ${fin?'':`<div class="dock" role="region" aria-label="Runde eintragen"><div class="wrap"><button class="btn primary big" data-act="tround" data-i="-1">Runde ${n+1} eintragen</button></div></div>`}`;
}
function openRoundSheet(idx){
  const g=game,isNew=idx<0,vals=isNew?[]:g.rounds[idx],cnt=g.players.length;
  ui.round={idx,neg:g.players.map((_,i)=>!isNew&&(+vals[i]||0)<0)};
  openSheet(`<div class="sh-head"><div><div class="eyebrow">${isNew?'Neue Runde':'Runde bearbeiten'}</div><h2>Runde ${isNew?g.rounds.length+1:idx+1}</h2></div>${closeBtn}</div>
  <form id="roundForm" autocomplete="off" novalidate>
    <div class="rrows">${g.players.map((p,i)=>`<div class="rrow" style="--pc:var(--p${p.color})"><span class="rname"><span class="dot"></span><span>${esc(p.name)}</span></span><button type="button" class="sgn" data-act="tsign" data-i="${i}" aria-pressed="${ui.round.neg[i]}" aria-label="Vorzeichen für ${esc(p.name)}">${ui.round.neg[i]?'−':'+'}</button><input id="rin-${i}" class="rin" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="5" enterkeyhint="${i<cnt-1?'next':'done'}" placeholder="0" value="${!isNew&&vals[i]?Math.abs(vals[i]):''}" aria-label="Punkte für ${esc(p.name)}"></div>`).join('')}</div>
    <p class="note">Leer heißt 0. Mit dem Vorzeichen-Knopf trägst du Minuspunkte ein.</p>
    <button class="btn primary big" type="submit">${isNew?'Runde speichern':'Änderung speichern'}</button>
    ${isNew?'':'<button type="button" class="link" data-act="tdel" style="margin-top:8px">Runde löschen</button>'}
  </form>`);
  const first=g.players.findIndex((_,i)=>!(+vals[i]));
  const el=$('#rin-'+(first<0?0:first));try{el&&el.focus({preventScroll:true})}catch(e){}
}
function submitRound(){
  if(!ui.round)return;
  const g=game,arr=g.players.map((_,i)=>{const el=$('#rin-'+i);const n=parseInt((el&&el.value)||'0',10)||0;return ui.round.neg[i]?-n:n});
  const idx=ui.round.idx;let msg;
  if(idx<0){g.rounds.push(arr);g.undo.push({k:'add'});msg=`Runde ${g.rounds.length} gespeichert`}
  else{g.undo.push({k:'edit',idx,prev:g.rounds[idx].slice()});g.rounds[idx]=arr;msg=`Runde ${idx+1} geändert`}
  if(g.undo.length>60)g.undo.shift();
  saveGame();closeSheet();render();toast(msg,true);
}
function tUndo(){
  const u=game.undo.pop();
  if(!u){toast('Nichts zum Rückgängigmachen');return}
  if(u.k==='add')game.rounds.pop();
  else if(u.k==='edit')game.rounds[u.idx]=u.prev;
  else if(u.k==='del')game.rounds.splice(u.idx,0,u.prev);
  if(game.status==='finished'&&u.k==='add'){game.status='active';delete game.finishedAt;game.record=null;ui.review=false}
  saveGame();closeSheet();render();toast('Rückgängig gemacht');
}
function tMenu(){
  const g=game,fin=g.status==='finished',last=g.undo[g.undo.length-1];
  const desc=last?(last.k==='add'?'Letzte Runde entfernen':last.k==='edit'?`Änderung an Runde ${last.idx+1} zurücknehmen`:`Runde ${last.idx+1} wiederherstellen`):'Noch nichts eingetragen';
  openSheet(`<div class="sh-head"><div><div class="eyebrow">Punktetafel</div><h2>Menü</h2></div>${closeBtn}</div>
  <div class="menu">
    <button class="mi" data-act="undo" ${last?'':'disabled'}><span><span class="mi-t">Rückgängig</span><span class="mi-s">${esc(desc)}</span></span></button>

         :`<button class="mi" data-act="finish"><span><span class="mi-t">Jetzt auswerten</span><span class="mi-s">Spiel beenden und Rangliste zeigen</span></span></button>`}
    ${tblItem()}
    ${delItem()}
  </div>`);
}
function tAct(a,b){
  const i=+b.dataset.i,v=b.dataset.v;
  switch(a){
    case 'tmode':tset().mode=v;touchMeta();render();return true;
    case 'ttarget':tset().target=+v;touchMeta();render();return true;
  }
  if(!game||game.type!=='tafel')return false;
  switch(a){
    case 'tround':openRoundSheet(i);return true;
    case 'tsign':{if(!ui.round)return true;ui.round.neg[i]=!ui.round.neg[i];b.setAttribute('aria-pressed',ui.round.neg[i]);b.textContent=ui.round.neg[i]?'−':'+';return true}
    case 'tdel':{
      if(!ui.round||ui.round.idx<0)return true;
      if(!confirmed('tdel',null,''))return (b.textContent='Nochmal tippen zum Löschen',true);
      const idx=ui.round.idx;game.undo.push({k:'del',idx,prev:game.rounds[idx].slice()});game.rounds.splice(idx,1);
      saveGame();closeSheet();render();toast(`Runde ${idx+1} gelöscht`,true);return true}
  }
  return false;
}

function cleanGame(g){
  if(!g||!okId(g.id)||!GAMES[g.type])return null;
  const o={id:g.id,type:g.type,status:g.status==='finished'?'finished':'active',created:num(g.created),u:num(g.u),del:!!g.del,legacy:!!g.legacy,undo:[]};
  if(g.finishedAt)o.finishedAt=num(g.finishedAt);
  o.players=(Array.isArray(g.players)?g.players:[]).slice(0,8).map(p=>{
    const q={pid:okId(p&&p.pid)?p.pid:null,name:String((p&&p.name)||'?').slice(0,16),color:((num(p&&p.color)|0)%8+8)%8};
    if(o.legacy)q.total=num(p&&p.total);
    return q;
  });
  if(!o.players.length)return null;
  o.view=Math.min(o.players.length-1,Math.max(0,num(g.view)|0));
  o.turn=Math.min(o.players.length-1,Math.max(0,num(g.turn)|0));
  GAMES[g.type].clean(o,g);
  return o;
}

  const gm=GAMES[g.type],res=gm.result(g);

function hubTrend(){
  const groups={};
  finishedGames().slice().reverse().forEach(g=>{
    const gm=GAMES[g.type];if(gm.trend===false)return;
    const k=gm.key(g);
    (groups[k]||(groups[k]={key:k,label:gm.label(g)+(g.type==='wizard'?` · ${g.players.length} Spieler`:''),games:[]})).games.push(g);
  });
  const list=Object.values(groups).filter(x=>x.games.length>=2).sort((a,b)=>b.games.length-a.games.length);
  if(!list.length)return '';
  const cur=list.find(x=>x.key===ui.trendKey)||list[0];
  const all=cur.games,off=Math.max(0,all.length-24),gs=all.slice(off);
  const by={};
  gs.forEach((g,i)=>{
    GAMES[g.type].result(g).forEach(r=>{
      if(!r.pid)return;
      const s=by[r.pid]||(by[r.pid]={name:r.name,color:r.color,n:0,pts:[]});
      s.name=r.name;s.color=r.color;s.n++;s.pts.push([off+i+1,r.total]);
    });
  });
  const series=Object.values(by).sort((a,b)=>b.n-a.n).slice(0,8).map(s=>({name:s.name,color:`var(--c${s.color})`,mk:s.color,pts:s.pts}));
  if(!series.length)return '';
  const date=i=>fmtDate(num(all[i-1].finishedAt||all[i-1].u));
  const nums=gs.map((_,i)=>off+i+1);
  const chart=lineChart({id:'trend-'+cur.key,title:'Punkte pro Partie',series,xTitle:'Partie',h:236,
    head:x=>`Partie ${x} · ${date(x)}`,xmin:nums[0],xmax:nums[nums.length-1],
    table:{head:['Partie','Datum',...series.map(s=>s.name)],rows:nums.map(n=>[String(n),date(n),...series.map(s=>{const p=s.pts.find(q=>q[0]===n);return p?fmtN(p[1]):'–'})])},
    aria:`Liniendiagramm: Punkte pro Partie in ${cur.label}, ${gs.length} Partien, ${series.length} Spieler.`,
    note:'Jeder Punkt ist eine beendete Partie. Die Linie verbindet die Partien eines Spielers.'});
  return `<section class="sec"><h2 class="lbl">Entwicklung</h2>
    ${list.length>1?`<div class="chips" style="margin-top:0">${list.map(x=>`<button type="button" class="chip txt" data-act="trendkey" data-v="${esc(x.key)}" aria-pressed="${x.key===cur.key}">${esc(x.label)}</button>`).join('')}</div>`:''}
    <div class="card lcard">${chart}</div></section>`;
}
function hubHistory(){
  const fin=finishedGames(),recs=computeRecords();
  if(!fin.length)return '<div class="blank"><b>Noch nichts gespielt</b>Beendete Spiele erscheinen hier mit Rangliste. Rekorde und Siege pro Spieler wertet der Block automatisch aus.</div>';
  const item=g=>{
    const gm=GAMES[g.type],res=gm.result(g),multi=res.length>1;
    return `<li><button class="hitem" data-act="open" data-id="${g.id}"><span class="hd">${fmtDate(num(g.finishedAt||g.u))} · ${esc(gm.label(g))}${g.legacy?' · übernommen':''}</span><span class="hw">${res.map(r=>r.place===1&&multi?`<b>${esc(r.name)} ${r.total}</b>`:`${esc(r.name)} ${r.total}`).join(' · ')}</span></button></li>`;
  };
  return `${hubTrend()}${recs.length?`<section class="sec"><h2 class="lbl">Rekorde</h2><div class="recs">${recs.map(r=>`<div class="rec"><span class="lbl">${esc(r.label)}</span><b class="mono">${r.total}</b><span>${esc(r.name)} · ${fmtDate(r.date).slice(0,5)}</span></div>`).join('')}</div></section>`:''}
  <section class="sec"><h2 class="lbl">Gespielt <span class="count">${fin.length}</span></h2>
    <ul class="hist2">${fin.slice(0,ui.histN).map(item).join('')}</ul>
    ${fin.length>ui.histN?'<button class="btn" data-act="more">Mehr anzeigen</button>':''}
  </section>`;
}

function renderEnd(){
  const gm=GAMES[game.type],r=gm.result(game),win=r.filter(x=>x.place===1),solo=r.length===1;
  let head,lede;
  if(solo){head=`${r[0].total} Punkte`;lede=`${esc(r[0].name)}, das ist dein Endstand.`}
  else if(win.length>1){head='Unentschieden!';lede=`${win.map(x=>esc(x.name)).join(' und ')} teilen sich Platz 1 mit ${win[0].total} Punkten.`}
  else{const second=r.find(x=>x.place>1);head=`${esc(win[0].name)} gewinnt`;lede=`${win[0].total} Punkte${second?`, ${Math.abs(win[0].total-second.total)} ${gm.higherBetter?'vor':'Abstand zu'} ${esc(second.name)}`:''}.`}
  const note=gm.endNote(game);
  return `<main class="wrap end">
    <div><button class="link" data-act="home" style="margin-left:-2px">${ICON.chevL.replace('width="22" height="22"','width="16" height="16"')} Hauptmenü</button>
      <div class="eyebrow" style="margin-top:6px">${esc(gm.label(game))} · ${fmtDate(num(game.finishedAt||game.u))}</div><h1>${head}</h1><p class="lede">${lede}</p></div>
    ${game.record?`<div class="record">Neuer Rekord für ${esc(gm.label(game))}: ${game.record.best} Punkte (bisher ${game.record.prev}).</div>`:''}
    <ol class="podium">${r.map(x=>`<li class="pod ${x.place===1&&!solo?'win':''}" style="--pc:var(--p${x.color})"><span class="place">${x.place}.</span><span class="pname">${esc(x.name)}</span><span class="ptotal mono">${fmtN(x.total)}</span><span class="pbreak">${esc(x.sub||'')}</span></li>`).join('')}</ol>
    ${gm.endExtra?gm.endExtra(game):''}
    ${note?`<p class="note" style="margin:0">${esc(note)}</p>`:''}

      ${game.legacy?'':`<button class="btn primary big" data-act="rematch">Revanche${solo?'':' – nächster beginnt'}</button><button class="btn big" data-act="review">${gm.reviewLabel||'Blätter ansehen'}</button>`}

    </div>
  </main>`;
}

/* ---------- main render ---------- */
function render(){
  if(ui.screen==='game'&&(!game||game.del)){game=null;ui.screen='hub';ui.gameId=null}
  if(ui.screen==='setup'&&!ui.setup)ui.screen='hub';
  const app=$('#app');
  app.innerHTML=ui.screen==='setup'?renderSetup():ui.screen==='game'?GAMES[game.type].render():renderHub();
  document.body.classList.remove('typing');
  if(ui.screen==='game'&&game&&game.tbl){const tb=document.querySelector('#app .topbar');if(tb){tb.insertAdjacentHTML('beforeend',tblPill());tb.insertBefore(tb.lastElementChild,tb.children[tb.children.length-2]||null)}}
  ui.rolled=null;
  if(pendingFlash){const el=$(`.row[data-f="${pendingFlash}"]`);if(el)el.classList.add('flash');pendingFlash=null}
  if(ui.celebrate){ui.celebrate=false;confetti()}
}
function softRender(){
  const a=document.activeElement;
  if(a&&a.matches&&a.matches('input,textarea')&&$('#app').contains(a)){ui.pendingRender=true;return}
  render();
}

function storageText(){
  const n=sync.dirty.size;
  if(SA){
    if(sync.state==='ok')return ['Alles gespeichert','Deine Spieler und Spiele liegen auf dem Server. Sie bleiben ohne Ablaufdatum erhalten. Auf einem anderen Gerät holst du sie mit der Gerätekennung unten.'];
    if(sync.state==='syncing'||sync.state==='connect')return ['Speichert …','Die Daten werden mit dem Server abgeglichen.'];
    if(sync.state==='error')return ['Server nicht erreichbar',`${n} ${n===1?'Änderung wartet':'Änderungen warten'} auf die Übertragung. Bis dahin sind sie auf diesem Gerät gesichert. Der Block versucht es automatisch erneut.`];
    return ['Nur auf diesem Gerät','Der Server ist nicht erreichbar oder verlangt einen Zugangscode. Alles liegt vorerst nur im Browser dieses Geräts.'];
  }
  if(sync.state==='ok')return ['Alles gespeichert','Deine Spieler und Spiele liegen in deinem Claude-Konto. Sie bleiben ohne Ablaufdatum erhalten, solange du diesen Block nicht löschst, und erscheinen auf jedem Gerät, auf dem du ihn mit deinem Konto öffnest.'];
  if(sync.state==='syncing'||sync.state==='connect')return ['Speichert …','Die Daten werden mit deinem Konto abgeglichen.'];
  if(sync.state==='error')return ['Speichern klappt gerade nicht',`${n} ${n===1?'Änderung wartet':'Änderungen warten'} auf die Übertragung. Bis dahin sind sie auf diesem Gerät gesichert. Der Block versucht es automatisch erneut.`];
  return ['Nur auf diesem Gerät','In dieser Ansicht gibt es keinen Zugriff auf dein Konto. Alles liegt nur im Browser dieses Geräts und kann verloren gehen, wenn Browserdaten gelöscht werden. Öffne den Block über deinen Link in der Claude-App oder lade ein Backup herunter.'];
}

async function exportBackup(){
  const dl=sync.downloads;if(!dl)return;
  const data={format:'spielblock-backup',v:2,exported:new Date().toISOString(),meta:S.meta,games:Object.values(S.games).map(g=>Object.assign({},g,{undo:[]}))};
  const d=new Date(),ymd=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  try{await dl.save({filename:`spielblock-backup-${ymd}.json`,data:JSON.stringify(data,null,1)});toast('Backup gespeichert')}
  catch(e){if(!e||e.code!=='declined')toast('Backup ist hier nicht möglich')}
}
function importBackup(text){
  let d;try{d=JSON.parse(text)}catch(e){toast('Datei nicht lesbar');return}
  if(!d||d.format!=='spielblock-backup'||!d.meta||!Array.isArray(d.games)){toast('Das ist keine Spieleblock-Sicherung');return}
  const m=normMeta(d.meta);
  const had=new Set(players().map(p=>p.id));
  S.meta=mergeMeta(S.meta,m);
  const newP=S.meta.players.filter(p=>!had.has(p.id)).length;
  let newG=0;
  d.games.slice(0,5000).forEach(raw=>{
    const g=cleanGame(raw);if(!g)return;
    const l=S.games[g.id];
    if(!l){S.games[g.id]=g;newG++;markDirty('g/'+g.id)}
    else if(g.u>num(l.u)){S.games[g.id]=g;markDirty('g/'+g.id)}
  });
  S.meta.u=Date.now();markDirty('meta');closeSheet();render();
  toast(`Eingespielt: ${newP} Spieler, ${newG} Spiele neu`);
}

const okCode=c=>typeof c==='string'&&/^[A-Z0-9]{4,8}$/.test(c);
const CODE_CH='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const genCode=()=>Array.from({length:5},()=>CODE_CH[Math.floor(Math.random()*CODE_CH.length)]).join('');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const tblRef=code=>sync.db.doc('tables/'+code);
const seatRef=(code,c)=>sync.db.doc('tables/'+code+'/seats/'+c);
const tblGames=code=>Object.values(S.games).filter(g=>g&&g.tbl===code&&!g.del);
function sharedForm(g){const o=clone(g);LOCAL_KEYS.forEach(k=>delete o[k]);return o}
function normShared(g){const c=cleanGame(g);return c?JSON.stringify(sharedForm(c)):null}
const isObj=x=>x&&typeof x==='object'&&!Array.isArray(x);
const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
/* three-way merge of JSON: base = last synced state, l = mine, r = theirs */
function merge3(b,l,r){
  if(same(l,r))return l;
  if(same(l,b))return r;
  if(same(r,b))return l;
  if(isObj(l)&&isObj(r)){
    const bb=isObj(b)?b:{},o={};
    new Set([...Object.keys(l),...Object.keys(r)]).forEach(k=>{
      const inL=k in l,inR=k in r;
      if(inL&&inR)o[k]=merge3(bb[k],l[k],r[k]);
      else if(inL){if(k in bb&&same(bb[k],l[k]))return;o[k]=l[k]}
      else{if(k in bb&&same(bb[k],r[k]))return;o[k]=r[k]}
    });
    return o;
  }
  if(Array.isArray(l)&&Array.isArray(r)){
    const ba=Array.isArray(b)?b:[],n=Math.min(l.length,r.length);
    const head=Array.from({length:n},(_,i)=>merge3(ba[i],l[i],r[i]));
    return head.concat((l.length>=r.length?l:r).slice(n));
  }
  return l;
}
function applyShared(loc,sh){
  Object.keys(loc).forEach(k=>{if(!LOCAL_KEYS.includes(k))delete loc[k]});
  Object.assign(loc,clone(sh));
  loc.view=Math.min(loc.players.length-1,Math.max(0,num(loc.view)|0));
}
const mySeat=code=>{const m=TBL.seats[code]||{};const c=Object.keys(m).find(k=>m[k]===sync.uid);return c===undefined?null:+c};
const seatIdx=g=>g.tblSeat==null?-1:g.players.findIndex(p=>p.color===g.tblSeat);

/* ---- writing ---- */
function tblSchedule(g){
  if(!g||!g.tbl)return;
  g.tblDirty=true;
  if(!sync.db||TBL.ro)return;
  TBL.ver[g.id]=(TBL.ver[g.id]||0)+1;
  clearTimeout(TBL.t[g.id]);TBL.t[g.id]=setTimeout(()=>tblFlush(g.id),300);
}
async function tblFlush(id){
  if(TBL.busy[id]||!sync.db||TBL.ro)return;
  TBL.busy[id]=true;
  try{
    for(let guard=0;guard<5;guard++){
      const g=S.games[id];if(!g||!g.tbl)break;
      const v=TBL.ver[id]||0,ref=tblRef(g.tbl),s=await ref.get();
      let out=sharedForm(g),host=sync.uid,created=Date.now();
      if(s.exists){
        const d=s.data()||{};host=d.host||host;created=d.created||created;
        const rc=cleanGame(d.game);
        if(rc&&rc.id===g.id){const remote=sharedForm(rc),base=TBL.base[id]?JSON.parse(TBL.base[id]):remote;out=merge3(base,out,remote)}
        else if(rc&&!g.tblTake){TBL.busy[id]=false;tblMoved(g.tbl,d);return}
      }
      out.u=Date.now();
      const norm=normShared(out);if(!norm)break;
      const clean=JSON.parse(norm);
      await ref.set({code:g.tbl,host,created,u:out.u,game:clean});
      TBL.base[id]=norm;g.tblBase=norm;delete g.tblTake;TBL.tries[id]=0;
      if((TBL.ver[id]||0)===v){
        if(!same(sharedForm(g),clean)){applyShared(g,clean);softRender()}
        g.tblDirty=false;markDirty('g/'+id);break;
      }
    }
  }catch(e){tblWriteError(id,e)}
  finally{TBL.busy[id]=false}
}
function tblWriteError(id,e){
  if(e&&e.code==='invalid_argument'){
    TBL.ro=true;toast('Du darfst am Tisch nur zuschauen');
    const g=S.games[id];if(g)tblResync(g);
    return;
  }
  TBL.tries[id]=(TBL.tries[id]||0)+1;
  if(TBL.tries[id]<4)setTimeout(()=>tblFlush(id),1500*TBL.tries[id]);
  else if(Date.now()-TBL.toastAt>20000){TBL.toastAt=Date.now();toast('Tisch gerade nicht erreichbar, Änderungen bleiben lokal')}
}
async function tblResync(g){
  try{
    const s=await tblRef(g.tbl).get();if(!s.exists)return;
    const c=cleanGame(s.data().game);
    if(c&&c.id===g.id){applyShared(g,sharedForm(c));TBL.base[g.id]=normShared(c);g.tblBase=TBL.base[g.id];g.tblDirty=false;markDirty('g/'+g.id);softRender()}
  }catch(e){}
}

/* ---- reading ---- */
function adoptTableGame(code,d){
  const cg=cleanGame(d.game);if(!cg||!okId(cg.id))return null;
  if(S.games[cg.id])return S.games[cg.id];
  cg.tbl=code;cg.tblHost=d.host===sync.uid;cg.tblSeat=mySeat(code);
  if(cg.tblSeat!=null)cg.view=Math.max(0,cg.players.findIndex(p=>p.color===cg.tblSeat));
  const norm=normShared(cg);TBL.base[cg.id]=norm;cg.tblBase=norm;
  Object.values(S.games).forEach(o=>{if(o.id!==cg.id&&o.tbl===code)tblDrop(o)});
  S.games[cg.id]=cg;markDirty('g/'+cg.id);
  return cg;
}
function tblMoved(code,d){
  const cur=tblGames(code)[0],ng=adoptTableGame(code,d);
  if(ng&&cur&&ng.id!==cur.id&&ui.screen==='game'&&ui.gameId===cur.id){openGame(ng.id);toast('Neue Partie am Tisch gestartet')}
  else softRender();
}
function onTable(code,snap){
  if(!snap.exists){
    if(snap.metadata&&snap.metadata.fromCache)return;
    const gs=tblGames(code);if(!gs.length)return;
    gs.forEach(tblDrop);tblUnsub(code);
    toast('Der Live-Tisch wurde beendet. Dein Stand bleibt gespeichert.');
    if(ui.tsheet)closeSheet();
    softRender();return;
  }
  const d=snap.data()||{},rc=cleanGame(d.game);if(!rc)return;
  const cur=tblGames(code).find(g=>g.id===rc.id);
  if(!cur){tblMoved(code,d);return}
  const rj=normShared(rc);
  if(rj===TBL.base[cur.id])return;
  const remote=JSON.parse(rj),base=TBL.base[cur.id]?JSON.parse(TBL.base[cur.id]):remote;
  const merged=cur.tblDirty?merge3(base,sharedForm(cur),remote):remote;
  applyShared(cur,merged);
  TBL.base[cur.id]=rj;cur.tblBase=rj;markDirty('g/'+cur.id);
  softRender();
}
function onSeats(code,q){
  const m={};q.docs.forEach(d=>{const x=d.data();if(x&&x.uid)m[d.id]=x.uid});
  TBL.seats[code]=m;
  const mine=mySeat(code);
  tblGames(code).forEach(g=>{
    if(g.tblSeat!==mine){g.tblSeat=mine;markDirty('g/'+g.id);if(mine!=null){const i=g.players.findIndex(p=>p.color===mine);if(i>=0)g.view=i}}
  });
  if(ui.tsheet&&game&&game.tbl===code)openTblSheet();
  softRender();
}
function tblSubscribe(code){
  if(!sync.db||TBL.subs[code])return;
  const u1=tblRef(code).onSnapshot(s=>onTable(code,s),()=>{});
  const u2=sync.db.collection('tables/'+code+'/seats').onSnapshot(q=>onSeats(code,q),()=>{});
  TBL.subs[code]=()=>{try{u1()}catch(e){}try{u2()}catch(e){}};
}
function tblUnsub(code){if(!tblGames(code).length&&TBL.subs[code]){TBL.subs[code]();delete TBL.subs[code]}}
function tblDrop(g){['tbl','tblHost','tblSeat','tblBase','tblDirty','tblTake'].forEach(k=>delete g[k]);markDirty('g/'+g.id)}
function tblBoot(){
  if(!sync.db)return;
  Object.values(S.games).forEach(g=>{
    if(!g.tbl||g.del)return;
    if(!okCode(g.tbl)){tblDrop(g);return}
    if(g.tblBase)TBL.base[g.id]=g.tblBase;
    const recent=g.status!=='finished'||Date.now()-num(g.finishedAt||g.u)<12*3600e3;
    if(!recent){tblDrop(g);return}
    tblSubscribe(g.tbl);
    if(g.tblDirty)tblSchedule(g);
  });
  try{if(sync.user)sync.user.can('data.write').then(v=>{if(v===false){TBL.ro=true;softRender()}})}catch(e){}
}

/* ---- host / join ---- */
async function tblStart(){
  const g=game;if(!g)return;
  if(!sync.db||!sync.uid){toast(SA?'Der Server ist gerade nicht erreichbar':'Der Live-Tisch braucht die Verbindung zu deinem Konto');return}
  if(g.tbl){openTblSheet();return}
  try{
    let code=null,ref=null;
    for(let k=0;k<6&&!code;k++){const c=genCode(),s=await tblRef(c).get();if(!s.exists){code=c;ref=tblRef(c)}}
    if(!code){toast('Gerade kein freier Code, bitte nochmal');return}
    const sh=sharedForm(g),norm=normShared(g);
    await ref.set({code,host:sync.uid,created:Date.now(),u:Date.now(),game:JSON.parse(norm)});
    g.tbl=code;g.tblHost=true;g.tblSeat=null;g.tblBase=norm;g.tblDirty=false;TBL.base[g.id]=norm;
    markDirty('g/'+g.id);tblSubscribe(code);
    render();openTblSheet();
  }catch(e){
    if(e&&e.code==='invalid_argument')toast('Dir fehlt die Berechtigung, einen Live-Tisch anzulegen');
    else toast('Live-Tisch konnte nicht gestartet werden');
  }
}
async function tblJoin(raw){
  if(!sync.db){toast(SA?'Der Server ist gerade nicht erreichbar':'Dafür brauchst du die Verbindung zu deinem Konto');return}
  const code=String(raw||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8);
  if(!okCode(code)){toast('Bitte den Code eingeben');return}
  const ex=tblGames(code)[0];
  if(ex){openGame(ex.id);openTblSheet();return}
  let s;
  try{s=await tblRef(code).get()}catch(e){toast('Tisch gerade nicht erreichbar');return}
  if(!s.exists){toast('Keinen Tisch mit diesem Code gefunden');return}
  const d=s.data()||{};
  try{const seats=await sync.db.collection('tables/'+code+'/seats').get();const m={};seats.docs.forEach(x=>{const y=x.data();if(y&&y.uid)m[x.id]=y.uid});TBL.seats[code]=m}catch(e){}
  const g=adoptTableGame(code,d);
  if(!g){toast('Dieser Tisch ist ungültig');return}
  try{if(sync.user&&(await sync.user.can('data.write'))===false)TBL.ro=true}catch(e){}
  tblSubscribe(code);ui.joinCode='';
  openGame(g.id);openTblSheet();
}
async function tblClaim(color){
  const g=game;if(!g||!g.tbl)return;
  const code=g.tbl;
  try{
    const m=TBL.seats[code]||{};
    for(const c of Object.keys(m).filter(c=>m[c]===sync.uid&&+c!==color))await seatRef(code,c).delete();
    const s=await seatRef(code,color).get();
    if(s.exists&&s.data().uid&&s.data().uid!==sync.uid){toast('Der Platz ist schon belegt');return}
    await seatRef(code,color).set({uid:sync.uid,at:Date.now()});
    await sleep(350);
    const s2=await seatRef(code,color).get();
    if(!s2.exists||s2.data().uid!==sync.uid){toast('Der Platz wurde gerade vergeben');return}
    TBL.seats[code]=Object.assign({},TBL.seats[code]||{},{[color]:sync.uid});
    g.tblSeat=color;const i=g.players.findIndex(p=>p.color===color);if(i>=0)g.view=i;
    markDirty('g/'+g.id);render();openTblSheet();
    toast(`Du bist ${g.players[i].name}`);
  }catch(e){
    if(e&&e.code==='invalid_argument'){TBL.ro=true;toast('Dir fehlt die Berechtigung, mitzuspielen. Du schaust zu.');render();openTblSheet()}
    else toast('Platz konnte nicht gewählt werden');
  }
}
async function tblRelease(){
  const g=game;if(!g||!g.tbl)return;
  try{const m=TBL.seats[g.tbl]||{};for(const c of Object.keys(m).filter(c=>m[c]===sync.uid))await seatRef(g.tbl,c).delete()}catch(e){}
  const m=Object.assign({},TBL.seats[g.tbl]||{});Object.keys(m).forEach(c=>{if(m[c]===sync.uid)delete m[c]});TBL.seats[g.tbl]=m;
  g.tblSeat=null;markDirty('g/'+g.id);render();openTblSheet();
}
async function tblEnd(g){
  const code=g.tbl,host=g.tblHost;
  tblDrop(g);
  if(host&&sync.db){
    try{const seats=await sync.db.collection('tables/'+code+'/seats').get();for(const d of seats.docs)await seatRef(code,d.id).delete()}catch(e){}
    try{await tblRef(code).delete()}catch(e){}
  }else if(sync.db){
    try{const m=TBL.seats[code]||{};for(const c of Object.keys(m).filter(c=>m[c]===sync.uid))await seatRef(code,c).delete()}catch(e){}
  }
  tblUnsub(code);
  closeSheet();render();toast(host?'Live-Tisch beendet':'Tisch verlassen');
}
async function tblCopy(code){
  const txt=`Spieleblock, Live-Tisch-Code: ${code}`;
  try{await navigator.clipboard.writeText(txt);toast('Code kopiert')}catch(e){toast('Code: '+code)}
}

  const g=game,on=g&&g.tbl;

}
function tblPill(){
  const g=game,i=seatIdx(g);
  return `<button class="livepill${TBL.ro?' ro':''}" data-act="tblsheet" aria-label="Live-Tisch ${esc(g.tbl)}${TBL.ro?', nur Zuschauen':''}"><i></i><span>${TBL.ro?'Zuschauen':i>=0?esc(shortName(g.players[i].name)):'Live'}</span></button>`;
}
function openTblSheet(){
  const g=game;if(!g)return;
  ui.tsheet=true;
  if(!sync.db){
    openSheet(`<div class="sh-head"><div><div class="eyebrow">Mehrspieler</div><h2>Live-Tisch</h2></div>${closeBtn}</div>
    <p class="wz-sum">${SA?'Der Server ist gerade nicht erreichbar. Sobald die Verbindung steht, ist der Live-Tisch verfügbar.':'Der Live-Tisch braucht die Verbindung zu deinem Konto. Öffne den Block angemeldet, dann ist er verfügbar.'}</p>`);return;
  }
  if(!g.tbl){
    openSheet(`<div class="sh-head"><div><div class="eyebrow">Mehrspieler</div><h2>Live-Tisch</h2></div>${closeBtn}</div>
    <div class="tbl-info"><p>Jeder öffnet den Block auf seinem Handy, tippt unter „Spiele“ auf <b>Live-Tisch beitreten</b>, gibt den Code ein und wählt seinen Namen. Alle sehen den Stand sofort und tragen für sich ein.</p>
    ${SA?'':'<p class="note" style="margin:0">Mitspieler brauchen ein Claude-Konto. Eintragen dürfen nur Personen mit Schreibrechten (im Teilen-Menü der Seite als Mitwirkende eingeladen), alle anderen können zuschauen.</p>'}</div>
    <button class="btn primary big" data-act="tblstart" style="margin-top:14px">Live-Tisch starten</button>`);
    return;
  }
  const code=g.tbl,seats=TBL.seats[code]||{},me=mySeat(code);
  const rows=g.players.map(p=>{
    const u=seats[p.color],mine=u&&u===sync.uid;
    return `<div class="tseat ${mine?'mine':''}" style="--pc:var(--p${p.color})">${av(p)}<span class="tn"><b>${esc(p.name)}</b><small>${mine?'Das bist du':u?'Belegt':'Frei'}</small></span>${
      TBL.ro?'':mine?'<button class="btn sm" data-act="tblunseat">Freigeben</button>':u?'':`<button class="btn sm" data-act="tblseat" data-c="${p.color}">Das bin ich</button>`}</div>`;
  }).join('');
  openSheet(`<div class="sh-head"><div><div class="eyebrow">Live-Tisch${g.tblHost?' · du bist Gastgeber':''}</div><h2>Mit anderen spielen</h2></div>${closeBtn}</div>
  <div class="tbl-code" aria-label="Code ${esc(code)}">${esc(code)}</div>
  <p class="tbl-how">Mitspieler: Spieleblock öffnen, <b>Spiele</b>, <b>Live-Tisch beitreten</b>, Code eingeben, Namen wählen.</p>
  ${TBL.ro?'<div class="notice" style="margin:8px 0"><span>Dir fehlt die Berechtigung zum Eintragen. Du siehst den Stand live, kannst aber nichts ändern.</span></div>':''}
  <h3 class="tbl-h">Wer bist du?</h3>
  <div class="tseats">${rows}</div>
  <div class="tbl-btns"><button class="btn" data-act="tblcopy" data-code="${esc(code)}">Code kopieren</button>
  <button class="btn ${g.tblHost?'danger':''}" data-act="tblend">${g.tblHost?'Live-Tisch beenden':'Tisch verlassen'}</button></div>
  ${g.tblHost?'<p class="note">Beenden löscht den Tisch für alle. Jeder behält seine lokale Kopie des Spiels.</p>':'<p class="note">Beim Verlassen bleibt deine lokale Kopie erhalten, aber ohne Live-Abgleich.</p>'}`);
}
const TBL_SAFE=new Set(['home','menu','close','tblsheet','tblcopy','tblend','tblseat','tblunseat','tblstart','ctable','showresult','review','view','gototurn','tcell','table','rules','rulestab','info','wrules','tab','input','setinput','wake','more']);
const tblBlocked=a=>!!(ui.screen==='game'&&game&&game.tbl&&TBL.ro&&!TBL_SAFE.has(a));
function tblAct(a,b){
  switch(a){
    case 'tblstart':tblStart();return true;
    case 'tblsheet':openTblSheet();return true;
    case 'tblseat':tblClaim(+b.dataset.c);return true;
    case 'tblunseat':tblRelease();return true;
    case 'tblcopy':tblCopy(b.dataset.code);return true;
    case 'tblend':{
      if(!game||!game.tbl)return true;
      const host=game.tblHost;
      if(host&&!confirmed('tblend',null,''))return (b.textContent='Nochmal tippen zum Beenden',true);
      tblEnd(game);return true}
  }
  return false;
}

/* =====================================================
   EVENTS
   ===================================================== */
function hubAct(a,b){
  const i=+b.dataset.i,v=b.dataset.v,id=b.dataset.id;
  if(a.startsWith('tbl'))return tblAct(a,b);
  switch(a){
    case 'close':closeSheet();return true;
    case 'tab':ui.tab=v;ui.newName='';render();window.scrollTo(0,0);return true;
    case 'open':openGame(id);return true;
    case 'home':if(ui.screen==='game')leaveGame();else{ui.screen='hub';ui.setup=null;render();window.scrollTo(0,0)}return true;
    case 'newgame':openSetup(b.dataset.type);return true;
    case 'storage':openStorage();return true;
    case 'export':exportBackup();return true;
    case 'import':{const f=$('#impFile');if(f)f.click();return true}
    case 'retry':closeSheet();syncNow();return true;
    case 'more':ui.histN+=25;render();return true;
    case 'ctable':ui.ct[id]=!ui.ct[id];render();return true;
    case 'trendkey':ui.trendKey=v;render();return true;
    case 'showarch':ui.showArch=!ui.showArch;render();return true;
    case 'selp':{
      const s=ui.setup.sel,k=s.indexOf(id);
      if(k>=0)s.splice(k,1);else if(s.length>=(GAMES[ui.setup.type].max||8)){toast(`Maximal ${GAMES[ui.setup.type].max||8} Spieler`);return true}else s.push(id);
      render();return true}
    case 'shuffle':{const s=ui.setup.sel;for(let k=s.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[s[k],s[j]]=[s[j],s[k]]}render();const f=pById(s[0]);if(f)toast(`${f.name} beginnt`);return true}
    case 'startgame':startGame();return true;
    case 'pl':openPlayer(id);return true;
    case 'plcolor':if(ui.psheet){updatePlayer(ui.psheet,{color:+b.dataset.c});openPlayer(ui.psheet);render()}return true;
    case 'plarch':{
      if(!ui.psheet)return true;
      if(!confirmed('plarch',b,'Nochmal tippen zum Archivieren'))return true;
      const p=pById(ui.psheet);updatePlayer(ui.psheet,{arch:true});closeSheet();render();toast(`${p?p.name:'Spieler'} archiviert`);return true}
    case 'plrestore':{updatePlayer(id,{arch:false});render();toast('Spieler zurückgeholt');return true}
    case 'undo':{$('#toast').classList.remove('show');if(game)GAMES[game.type].undo();return true}
    case 'menu':if(game)GAMES[game.type].menu();return true;
    case 'wake':S.meta.settings.wake=!S.meta.settings.wake;touchMeta();b.setAttribute('aria-checked',S.meta.settings.wake);applyWake(true);return true;
    case 'finish':{
      if(!game)return true;
      const gm=GAMES[game.type];
      if(gm.canFinish&&!gm.canFinish(game)){toast(gm.cantFinishMsg);return true}
      const warn=gm.finishWarn(game);
      if(warn&&!confirmed('finish',b,warn))return true;
      closeSheet();finishGame();render();window.scrollTo(0,0);return true}
    case 'delgame':{
      if(!game)return true;
      if(!confirmed('del',b,'Nochmal tippen zum Löschen'))return true;
      if(game.tbl)tblEnd(game);
      game.del=true;saveGame();toast('Spiel gelöscht');leaveGame();return true}
    case 'review':ui.review=true;render();window.scrollTo(0,0);return true;
    case 'showresult':closeSheet();ui.review=false;render();window.scrollTo(0,0);return true;
    case 'rematch':{
      if(!game)return true;
      const old=game,ng=GAMES[old.type].rematch(old);
      if(old.tbl){ng.tbl=old.tbl;ng.tblHost=old.tblHost;ng.tblSeat=old.tblSeat;ng.tblTake=true;const si=ng.players.findIndex(p=>p.color===ng.tblSeat);if(si>=0)ng.view=si;tblDrop(old)}
      stripUndo(old);saveGame();
      S.games[ng.id]=ng;touchGame(ng);openGame(ng.id);toast(`Revanche! ${ng.players[0].name} beginnt`);return true}
  }
  return false;
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act;
  if(tblBlocked(a)){if(Date.now()-TBL.toastAt>2500){TBL.toastAt=Date.now();toast('Nur Zuschauen: Dir fehlt die Berechtigung zum Eintragen')}return}
  if(hubAct(a,b))return;
  const gm=ui.screen==='game'&&game?GAMES[game.type]:ui.screen==='setup'&&ui.setup?GAMES[ui.setup.type]:null;
  if(gm&&gm.act)gm.act(a,b);
});
document.addEventListener('submit',e=>{
  const id=e.target.id;
  if(!['numForm','addForm','roundForm','plForm','joinForm','keyForm'].includes(id))return;
  e.preventDefault();
  if(id==='numForm'){const n=validateInput();if(n===null||!ui.sheet)return;commit(ui.sheet.pi,ui.sheet.fid,n,false,ui.firstSheet)}
  else if(id==='roundForm')submitRound();
  else if(id==='keyForm'){const v=($('#keyIn')||{}).value;if(!window.__SB.setUid(v))toast('Diese Kennung ist ungültig');}
  else if(id==='joinForm')tblJoin(($('#joinCode')||{}).value);
  else if(id==='plForm'){
    const nm=($('#plname').value||'').trim();
    if(!nm){toast('Name eingeben');return}
    updatePlayer(ui.psheet,{name:nm.slice(0,16)});const pid=ui.psheet;render();openPlayer(pid);toast('Name gespeichert');
  }else{
    const r=addPlayer(ui.newName);
    if(!r){toast('Bitte einen Namen eingeben');return}
    ui.newName='';
    if(ui.screen==='setup'&&!ui.setup.sel.includes(r.p.id)&&ui.setup.sel.length<(GAMES[ui.setup.type].max||8))ui.setup.sel.push(r.p.id);
    toast(r.isNew?`${r.p.name} hinzugefügt`:r.restored?`${r.p.name} zurückgeholt`:`${r.p.name} gibt es schon`);
    render();const f=$('#newp');if(f)try{f.focus()}catch(x){}
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='numIn')validateInput();
  else if(t.id==='newp')ui.newName=t.value;
  else if(t.id==='joinCode'){t.value=t.value.toUpperCase().replace(/[^A-Z0-9]/g,'');ui.joinCode=t.value}
  else if(t.id==='tgt'){
    const n=parseInt(t.value.replace(/\D/g,''),10)||0;t.value=n?String(n):'';
    tset().target=n;touchMeta();
    document.querySelectorAll('[data-act="ttarget"]').forEach(x=>x.setAttribute('aria-pressed',String(+x.dataset.v===n)));
  }
  else if(t.classList.contains('rin'))t.value=t.value.replace(/\D/g,'');
});
document.addEventListener('change',e=>{
  if(e.target.id!=='impFile')return;
  const f=e.target.files&&e.target.files[0];if(!f)return;
  if(f.size>20e6){toast('Datei ist zu groß');return}
  const r=new FileReader();r.onload=()=>importBackup(String(r.result));r.onerror=()=>toast('Datei nicht lesbar');r.readAsText(f);e.target.value='';
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('#layer').firstChild){closeSheet();return}
  const t=e.target;
  if(e.key==='Enter'&&t.classList&&t.classList.contains('rin')){
    e.preventDefault();
    const k=+t.id.slice(4),nx=$('#rin-'+(k+1));
    if(nx)nx.focus();else submitRound();
  }
});
document.addEventListener('focusin',e=>{if(e.target.classList&&e.target.classList.contains('pin'))document.body.classList.add('typing')});
document.addEventListener('focusout',e=>{
  if(e.target.classList&&e.target.classList.contains('pin'))setTimeout(()=>{
    const a=document.activeElement;
    if(!(a&&a.classList&&a.classList.contains('pin')))document.body.classList.remove('typing');
    if(ui.pendingRender&&!(a&&a.matches&&a.matches('input'))){ui.pendingRender=false;render()}
  },60);
});

/* ---------- toast ---------- */
let toastT;
function toast(msg,withUndo=false){
  const t=$('#toast');
  t.innerHTML=`<span>${esc(msg)}</span>${withUndo?'<button data-act="undo">Rückgängig</button>':''}`;
  t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),withUndo?4000:2400);
}

/* ---------- keyboard-aware sheets ---------- */
if(window.visualViewport){
  const vv=window.visualViewport;
  const upd=()=>{const kb=Math.max(0,window.innerHeight-vv.height-vv.offsetTop);document.documentElement.style.setProperty('--kb',kb+'px');document.documentElement.style.setProperty('--vvh',vv.height+'px')};
  vv.addEventListener('resize',upd);vv.addEventListener('scroll',upd);upd();
}

/* ---------- wake lock ---------- */
let wake=null;
async function applyWake(user){
  try{
    if(S.meta.settings.wake&&ui.screen==='game'&&document.visibilityState==='visible'){
      if(!wake&&navigator.wakeLock){wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>{wake=null});if(user)toast('Bildschirm bleibt an')}
      else if(!navigator.wakeLock&&user)toast('Dieses Gerät erlaubt das hier leider nicht');
    }else if(wake){await wake.release();wake=null}
  }catch(e){wake=null;if(user)toast('Display-Sperre lässt sich hier nicht verhindern')}
}

/* ---------- visibility / lifecycle ---------- */
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'){flushCacheNow();flush()}
  else{
    applyWake(false);
    if(sync.db&&Date.now()-sync.lastPull>45000&&!sync.dirty.size&&!sync.flushing){pull().then(ch=>{if(ch)softRender()}).catch(()=>{})}
  }
});
addEventListener('pagehide',()=>{flushCacheNow();flush()});
addEventListener('online',()=>{if(sync.db)flush()});

/* ---------- confetti ---------- */
function confetti(){
  if(reduceMotion)return;
  const c=$('#confetti'),ctx=c.getContext('2d');if(!ctx)return;
  const W=innerWidth,H=innerHeight,dpr=Math.min(2,devicePixelRatio||1);
  c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  const cs=getComputedStyle(document.documentElement);
  const cols=[0,1,2,3,4,5,6].map(k=>cs.getPropertyValue('--p'+k).trim()||'#D62839');
  const parts=Array.from({length:150},()=>({x:W/2+(Math.random()-.5)*W*.5,y:H*.3,vx:(Math.random()-.5)*10,vy:-Math.random()*12-5,s:5+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.35,c:cols[Math.floor(Math.random()*cols.length)],sq:Math.random()<.25}));
  c.classList.add('on');const t0=performance.now();let last=t0;
  function step(t){const dt=Math.min(2,(t-last)/16.7);last=t;ctx.clearRect(0,0,W,H);
    parts.forEach(p=>{p.vy+=.3*dt;p.vx*=.992;p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=p.vr*dt;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;
      if(p.sq){ctx.beginPath();ctx.roundRect?ctx.roundRect(-p.s/2,-p.s/2,p.s,p.s,2):ctx.rect(-p.s/2,-p.s/2,p.s,p.s);ctx.fill()}else ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore()});
    if(t-t0<3400)requestAnimationFrame(step);else{ctx.clearRect(0,0,W,H);c.classList.remove('on')}}
  requestAnimationFrame(step);
}

/* =====================================================
   BOOT
   ===================================================== */
async function initSync(){
  const C=window.claude;
  sync.hasClaude=!!(C&&C.use);
  if(!sync.hasClaude){setState('local');sync.ready=true;softRender();return}
  try{
    const [user,db,dl]=await Promise.all([C.use('user'),C.use('db'),C.use('downloads')]);
    sync.downloads=dl||null;sync.user=user||null;
    const uid=user?await user.id():null;
    if(db&&uid){sync.db=db;sync.uid=uid}
  }catch(e){}
  if(!sync.db){setState('local');sync.ready=true;softRender();return}
  softRender();
  await syncNow();
  tblBoot();
  softRender();
}
function boot(data){
  loadCache();
  migrateLegacy();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  const u=data&&data.ui;
  if(u){
    if(u.tab)ui.tab=u.tab;
    if(u.screen==='game'&&S.games[u.gameId]&&!S.games[u.gameId].del){game=S.games[u.gameId];ui.screen='game';ui.gameId=u.gameId}
    else if(u.screen==='setup'&&u.setup&&GAMES[u.setup.type]){ui.screen='setup';ui.setup={type:u.setup.type,sel:(u.setup.sel||[]).filter(id=>pById(id))}}
  }
  sync.hasClaude=!!(window.claude&&window.claude.use);
  render();
  initSync();
}
try{window.claude&&window.claude.hot&&window.claude.hot.snapshot&&window.claude.hot.snapshot(()=>({ui:{screen:ui.screen,tab:ui.tab,gameId:ui.gameId,setup:ui.setup}}))}catch(e){}
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(boot);
else boot((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
})();
